worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 16384;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Public policy -> internal rate class.
    # Add new service:endpoint policies here.
    map "$http_x_ratelimit_service:$http_x_ratelimit_endpoint" $rl_uri {
        default       /_rl/unknown;

        "demo:slow"   /_rl/100;
        "demo:search" /_rl/500;
        "demo:work"   /_rl/1000;
    }

    # One shared-memory zone per rate class. The key is service:endpoint,
    # therefore different policies in the same class keep independent state.
    limit_req_zone "$http_x_ratelimit_service:$http_x_ratelimit_endpoint" zone=rl_100:10m rate=100r/s;
    limit_req_zone "$http_x_ratelimit_service:$http_x_ratelimit_endpoint" zone=rl_500:10m rate=500r/s;
    limit_req_zone "$http_x_ratelimit_service:$http_x_ratelimit_endpoint" zone=rl_1000:10m rate=1000r/s;

    log_format limiter '$remote_addr "$request" status=$status '
                       'service="$http_x_ratelimit_service" '
                       'endpoint="$http_x_ratelimit_endpoint" '
                       'limit_req_status="$limit_req_status" rt=$request_time';
    access_log /var/log/nginx/access.log limiter;

    server {
        listen 8080;
        server_name _;

        limit_req_status 429;

        location = /health {
            access_log off;
            return 204;
        }

        # Only public rate-limit API.
        location = /check {
            if ($request_method != POST) {
                return 405;
            }
            rewrite ^ $rl_uri last;
        }

        location = /_rl/100 {
            internal;
            limit_req zone=rl_100 burst=20 nodelay;
            try_files /__ratelimiter_allow_file_that_does_not_exist__ =204;
        }

        location = /_rl/500 {
            internal;
            limit_req zone=rl_500 burst=100 nodelay;
            try_files /__ratelimiter_allow_file_that_does_not_exist__ =204;
        }

        location = /_rl/1000 {
            internal;
            limit_req zone=rl_1000 burst=200 nodelay;
            try_files /__ratelimiter_allow_file_that_does_not_exist__ =204;
        }

        location = /_rl/unknown {
            internal;
            return 404;
        }
    }
}
