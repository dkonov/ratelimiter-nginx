worker_processes auto;
error_log /var/log/nginx/error.log notice;
events { worker_connections 16384; }
http {
    map "$http_x_ratelimit_service:$http_x_ratelimit_endpoint" $rl_uri {
        default       /_rl/unknown;
        "demo:order"  /_rl/order;
        "demo:common" /_rl/common;
        "demo:search" /_rl/search;
    }

    limit_req_zone "$http_x_ratelimit_service:$http_x_ratelimit_endpoint" zone=rl_order:10m  rate=100r/s;
    limit_req_zone "$http_x_ratelimit_service:$http_x_ratelimit_endpoint" zone=rl_common:10m rate=300r/s;
    limit_req_zone "$http_x_ratelimit_service:$http_x_ratelimit_endpoint" zone=rl_search:10m rate=10r/s;

    log_format limiter '$remote_addr status=$status service=$http_x_ratelimit_service endpoint=$http_x_ratelimit_endpoint limit=$limit_req_status';
    access_log /var/log/nginx/access.log limiter;

    server {
        listen 8080;
        limit_req_status 429;

        location = /health { access_log off; return 204; }
        location = /check {
            if ($request_method != POST) { return 405; }
            rewrite ^ $rl_uri last;
        }

        location = /_rl/order {
            internal;
            limit_req zone=rl_order burst=10 nodelay;
            try_files /__allow__ =204;
        }
        location = /_rl/common {
            internal;
            limit_req zone=rl_common burst=30 nodelay;
            try_files /__allow__ =204;
        }
        location = /_rl/search {
            internal;
            limit_req zone=rl_search burst=2 nodelay;
            try_files /__allow__ =204;
        }
        location = /_rl/unknown {
            internal;
            return 404;
        }
    }
}
