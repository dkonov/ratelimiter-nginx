services:
  nginx2:
    image: nginx:1.30.4-alpine
    ports:
      - "8081:8080"
    volumes:
      - ./nginx-multilang/nginx2.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 1s
      retries: 10

  python1:
    build:
      context: .
      dockerfile: demo/python-backend/Dockerfile
    environment: &py_env
      BACKEND_NAME: python1
      SERVICE_NAME: demo
      RATE_LIMIT_KEY: shared-global
      RATE_LIMITER_URL: http://nginx2:8080
      RATE_LIMITER_FAIL_MODE: open
    depends_on:
      nginx2: { condition: service_healthy }
    healthcheck: &app_health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 1s
      retries: 10

  python2:
    build:
      context: .
      dockerfile: demo/python-backend/Dockerfile
    environment:
      <<: *py_env
      BACKEND_NAME: python2
    depends_on:
      nginx2: { condition: service_healthy }
    healthcheck: *app_health

  java1:
    build:
      context: .
      dockerfile: demo/java-backend/Dockerfile
    environment: &java_env
      BACKEND_NAME: java1
      SERVICE_NAME: demo
      RATE_LIMIT_KEY: shared-global
      RATE_LIMITER_URL: http://nginx2:8080
      RATE_LIMITER_FAIL_MODE: open
    depends_on:
      nginx2: { condition: service_healthy }
    healthcheck: *app_health

  java2:
    build:
      context: .
      dockerfile: demo/java-backend/Dockerfile
    environment:
      <<: *java_env
      BACKEND_NAME: java2
    depends_on:
      nginx2: { condition: service_healthy }
    healthcheck: *app_health

  nginx1:
    image: nginx:1.30.4-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx-multilang/nginx1.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      python1: { condition: service_healthy }
      python2: { condition: service_healthy }
      java1: { condition: service_healthy }
      java2: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 1s
      retries: 10

  k6:
    image: grafana/k6:latest
    profiles: ["load"]
    volumes:
      - ./k6:/scripts:ro
    environment:
      TARGET_URL: http://nginx1:8080
    depends_on:
      nginx1: { condition: service_healthy }
