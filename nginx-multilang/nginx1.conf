worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events { worker_connections 16384; }

http {
    upstream python_pool {
        least_conn;
        server python1:8080;
        server python2:8080;
        keepalive 64;
    }

    upstream java_pool {
        least_conn;
        server java1:8080;
        server java2:8080;
        keepalive 64;
    }

    server {
        listen 8080;
        location = /health { return 204; }

        location /python/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://python_pool;
        }

        location /java/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://java_pool;
        }
    }
}
