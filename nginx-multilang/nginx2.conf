worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events { worker_connections 16384; }

http {
    map "$http_x_ratelimit_service:$http_x_ratelimit_endpoint" $rl_uri {
        default              /_rl/unknown;
        "demo:shared-global" /_rl/shared_10;
    }

    limit_req_zone "$http_x_ratelimit_service:$http_x_ratelimit_endpoint"
                   zone=shared_10:10m rate=10r/s;

    log_format limiter '$remote_addr "$request" status=$status '
                       'service="$http_x_ratelimit_service" '
                       'endpoint="$http_x_ratelimit_endpoint" '
                       'limit_req_status="$limit_req_status" rt=$request_time';
    access_log /var/log/nginx/access.log limiter;

    server {
        listen 8080;
        limit_req_status 429;

        location = /health { access_log off; return 204; }

        location = /check {
            if ($request_method != POST) { return 405; }
            rewrite ^ $rl_uri last;
        }

        location = /_rl/shared_10 {
            internal;
            limit_req zone=shared_10;
            try_files /__ratelimiter_allow_file_that_does_not_exist__ =204;
        }

        location = /_rl/unknown {
            internal;
            return 404;
        }
    }
}
