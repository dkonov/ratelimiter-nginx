worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 16384;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $request status=$status '
                    'upstream=$upstream_addr upstream_status=$upstream_status '
                    'rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    upstream backends {
        server backend1:8080 max_fails=3 fail_timeout=5s;
        server backend2:8080 max_fails=3 fail_timeout=5s;
        server backend3:8080 max_fails=3 fail_timeout=5s;
        keepalive 128;
    }

    server {
        listen 8080;
        server_name _;

        location = /health {
            access_log off;
            return 204;
        }

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 250ms;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;

            proxy_pass http://backends;
        }
    }
}
