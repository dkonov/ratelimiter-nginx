worker_processes auto;
events { worker_connections 16384; }

http {
    upstream go_backend {
        zone go_backend 64k;
        resolver 127.0.0.11 valid=5s ipv6=off;
        resolver_timeout 1s;
        server go1:8080 resolve;
        server go2:8080 resolve;
        server go3:8080 resolve;
    }

    upstream java_backend {
        zone java_backend 64k;
        resolver 127.0.0.11 valid=5s ipv6=off;
        resolver_timeout 1s;
        server java1:8080 resolve;
        server java2:8080 resolve;
        server java3:8080 resolve;
    }

    upstream python_backend {
        zone python_backend 64k;
        resolver 127.0.0.11 valid=5s ipv6=off;
        resolver_timeout 1s;
        server python1:8080 resolve;
        server python2:8080 resolve;
        server python3:8080 resolve;
    }

    server {
        listen 8080;

        location /api/go/ {
            proxy_pass http://go_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /api/java/ {
            proxy_pass http://java_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /api/python/ {
            proxy_pass http://python_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location = /health {
            return 204;
        }
    }
}
